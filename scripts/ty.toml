# ty configuration for the repository tooling under ``scripts/``.
#
# The application floor in ``pyproject.toml`` is 3.12, which is what ty assumes
# for everything it checks by default. The scripts here are PEP 723 tooling
# whose own inline metadata declares a CPython 3.14 floor, so they use
# ``typing.TypeIs``, PEP 695 generics, and ``PurePosixPath.full_match``. The
# Makefile's ``typecheck`` target points ty at this file for a second pass over
# ``scripts`` alone and excludes ``scripts`` from the application pass, so
# neither surface is checked against the other's interpreter.
environment = { python-version = "3.14" }

# ``scripts/duplication_gate.py`` declares cyclopts and tomlkit in its PEP 723
# block and ``uv run`` provisions them per invocation; they are never installed
# into the application virtualenv, so ty cannot resolve them from site-packages.
# Naming them here keeps the exemption minimal: any other unresolved import
# still fails the gate.
analysis = { allowed-unresolved-imports = ["cyclopts", "tomlkit", "tomlkit.*"] }
