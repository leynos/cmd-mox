[tool.ruff.lint.pydocstyle]
# Enforce NumPy docstring style
convention = "numpy"

[tool.pylint.main]
# Activate rules whose behaviour depends on the project's Python baseline.
py-version = "3.12"
# Expand directory targets like cmd_mox and tests even when they are not
# packages.
recursive = true
# Match the project file-size ceiling enforced during review.
max-module-lines = 400

[tool.pylint.design]
# Keep function call surfaces small enough to understand without memorising
# positional argument order.
max-args = 4
# The new Pylint gate complements Ruff's stricter PLR0914 threshold without
# forcing broad refactors while introducing the additional rule families below.
max-locals = 20
# Use Pylint's statement-count proxy for function length; Pylint 4 does not
# expose a distinct physical-lines-per-function option.
max-statements = 70
# Keep positional call surfaces aligned with Ruff's existing argument limit.
max-positional-arguments = 4

[tool.pylint."messages control"]
# Keep this Pylint pass focused on the explicitly selected messages.
#
# unknown-option-value (W0012) is disabled because inline pragmas such as
# `# pylint: disable-next=trivial-attribute-wrapper` name df12 messages, which
# this pass never registers. Pylint reports W0012 despite `disable = ["all"]`,
# so it is named explicitly. No validation is lost: the df12 pass in
# `pylintrc-df12.toml` registers both the core and df12 messages and enables
# W0012, so every pragma name is still checked against the complete vocabulary.
disable = [
    "all",
    "unknown-option-value",
]
enable = [
    # Logging format safety.
    "logging-format-interpolation",
    "logging-format-truncated",
    "logging-fstring-interpolation",
    "logging-not-lazy",
    "logging-too-few-args",
    "logging-too-many-args",
    "logging-unsupported-format",

    # Pattern matching correctness and readability.
    "bare-name-capture-pattern",
    "invalid-match-args-definition",
    "match-class-bind-self",
    "match-class-positional-attributes",
    "multiple-class-sub-patterns",
    "too-many-positional-sub-patterns",

    # Control-flow simplification.
    "chained-comparison",
    "condition-evals-to-constant",
    "consider-merging-isinstance",
    "consider-swap-variables",
    "consider-using-in",
    "consider-using-max-builtin",
    "consider-using-min-builtin",
    "consider-using-sys-exit",
    "consider-using-ternary",
    "inconsistent-return-statements",
    "no-else-break",
    "no-else-continue",
    "no-else-raise",
    "no-else-return",
    "redefined-argument-from-local",
    "simplifiable-condition",
    "simplifiable-if-expression",
    "simplifiable-if-statement",
    "simplify-boolean-expression",
    "stop-iteration-return",
    "super-with-arguments",
    "trailing-comma-tuple",
    "unnecessary-negation",
    "useless-return",

    # Collection and iterator idioms.
    "consider-iterating-dictionary",
    "consider-using-dict-comprehension",
    "consider-using-dict-items",
    "consider-using-enumerate",
    "consider-using-f-string",
    "consider-using-generator",
    "consider-using-get",
    "consider-using-join",
    "consider-using-set-comprehension",
    "unnecessary-comprehension",
    "unnecessary-dict-index-lookup",
    "unnecessary-list-index-lookup",
    "use-a-generator",
    "use-dict-literal",
    "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-len",
    "use-list-literal",
    "use-maxsplit-arg",
    "use-sequence-for-iteration",
    "use-yield-from",

    # Runtime APIs, resources, and compatibility hazards.
    "bad-open-mode",
    "bad-thread-instantiation",
    "boolean-datetime",
    "consider-using-with",
    "deprecated-argument",
    "deprecated-attribute",
    "deprecated-class",
    "deprecated-decorator",
    "deprecated-method",
    "forgotten-debug-statement",
    "invalid-envvar-default",
    "invalid-envvar-value",
    "method-cache-max-size-none",
    "redundant-unittest-assert",
    "shallow-copy-environ",
    "singledispatch-method",
    "singledispatchmethod-function",
    "subprocess-popen-preexec-fn",
    "subprocess-run-check",
    "unnecessary-dunder-call",
    "unnecessary-ellipsis",
    "unspecified-encoding",

    # Source layout and text hygiene.
    "missing-final-newline",
    "mixed-line-endings",
    "superfluous-parens",
    "trailing-newlines",
    "trailing-whitespace",
    "unexpected-line-ending-format",

    # Mutation during iteration.
    "modified-iterating-dict",
    "modified-iterating-list",
    "modified-iterating-set",

    # Structural complexity limits.
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-statements",
]

[tool.ty.environment]
# The estate typos-rollout scripts import each other as top-level modules,
# so ty needs scripts/ on the module search path alongside the default roots.
extra-paths = ["scripts"]

[tool.pytest.ini_options]
# Tests automatically killed after seconds elapsed
timeout = 30
testpaths = ["cmd_mox/unittests", "examples", "scripts/tests", "tests"]

[tool.mutmut]
# Flat layout: the package lives at the repository root.
source_paths = ["cmd_mox/"]
# The suite is split between tests/ and the in-package unit tests.
pytest_add_cli_args_test_selection = ["tests/", "cmd_mox/unittests/"]
runner = "python -m pytest -x -q --no-header -p no:cacheprovider"
# cmd_mox/unittests/ is test scaffolding shipped inside the package.
# shim.py and _shim_bootstrap.py execute only inside spawned shim
# subprocesses, outside mutmut's in-process test attribution, so their
# mutants would be unattributable noise.
do_not_mutate = [
    "cmd_mox/unittests/*",
    "cmd_mox/shim.py",
    "cmd_mox/_shim_bootstrap.py",
]
# mutmut runs pytest from mutants/; copy the assets tests resolve
# relative to the repository root (shared fixtures, BDD feature files,
# and the documentation exercised by the docs scenarios).
also_copy = ["conftest.py", "features/", "docs/"]

[tool.uv]
package = true

# Blocking duplication scan over the shipped package. Keep the detector pin in
# sync with NOSE_VERSION in the Makefile and the CI install step;
# tests/test_toolchain_contract.py enforces the match.
#
# `roots` names the maintained production Python only: `cmd_mox/` is the
# installed package, while `scripts/`, `tests/`, `examples/` and `features/`
# are tooling and examples, and `src/` is Rust. `exclude` is matched relative
# to each root, not to the repository root, so `unittests/*` is the shipped
# in-package test tree (`cmd_mox/unittests/`) rather than a repo-root path.
#
# `min-size` counts nose IL tokens, not Python lines. `surface = "all"` widens
# the reported surface but `top = 30` is not exhaustive: the gate adjudicates
# the thirty highest-ranked families, so lower-ranked duplication is reported
# nowhere and enforced nowhere.
[tool.nose]
version = "0.20.0"
roots = ["cmd_mox"]
mode = "syntax,semantic,near"
min-size = 24
surface = "all"
top = 30
exclude = ["unittests/*"]

# Reasoned exceptions for the duplication gate. Entries key on locations, not
# line spans: `path` (glob) matches any location in matching files, and
# `path::name` additionally requires nose's unit name. A `unit` entry names one
# key; a `members` entry names several. Either silences a family only when
# every location in it matches one of the entry's keys, so a new copy in an
# unlisted file still blocks. Record entries with
# `make duplication-allow FIRST=... [SECOND=...] REASON=...` and remove them
# when the gate reports them as stale, after confirming the duplication is
# really gone: a family can drop out of the ranked report without being fixed.
[tool.duplication_gate]

[[tool.duplication_gate.allow]]
members = ["cmd_mox/ipc/client.py::invoke_server", "cmd_mox/ipc/client.py::report_passthrough_result"]
reason = "nose matches the three-parameter signature and NumPy return-section boilerplate; each body is one delegating call to _send_request with a different request kind, and each docstring describes the Unix/Windows timeout split that applies to both. A shared wrapper would erase two distinct public entry points without sharing any logic."
[[tool.duplication_gate.allow]]
members = ["cmd_mox/ipc/_server_core.py::_default_invocation_response", "cmd_mox/response_strategy.py::default_response"]
reason = "Deliberate layer boundary, not a shared implementation: response_strategy imports Response from cmd_mox.ipc, so the ipc package cannot import response_strategy back without a cycle. _default_invocation_response is the transport base fallback when a server has no handler; default_response is the recording-mode strategy users select. nose is matching the two one-line bodies and their shared NumPy Returns boilerplate."
[[tool.duplication_gate.allow]]
members = ["cmd_mox/shimgen.py::is_broken_symlink", "cmd_mox/shimgen.py::has_non_symlink_collision"]
reason = "Two inverse one-line predicates over the same path: a broken symlink exists as a link but not as a target, a non-symlink collision exists as a target but not as a link. nose is matching their shared Parameters/Returns sections. Collapsing them would mean a boolean mode flag selecting is_symlink() or exists(), which is exactly the kind of shape-only helper the gate must not manufacture."
[[tool.duplication_gate.allow]]
members = ["cmd_mox/expectations.py::in_order", "cmd_mox/expectations.py::any_order"]
reason = "Two fluent DSL verbs whose bodies differ only in the boolean they store. nose matches the six-line shared Returns block and the identical return self. A combined setter would need an ordered=True/False argument, forcing callers to pass a boolean that the two named verbs exist to avoid; the API is the two names."
[[tool.duplication_gate.allow]]
members = ["cmd_mox/environment.py", "cmd_mox/fs_retry.py", "cmd_mox/ipc/named_pipe.py"]
reason = "One early-return idiom repeated in three Windows-only code paths: ensure PATHEXT carries .CMD, repair read-only permissions before rmtree, and guard the named-pipe accept loop. The first two are invoked unconditionally by cross-platform callers and must no-op on POSIX; the third keeps a state object whose production constructor already rejects non-Windows use inert. Each guards a different operation with different consequences, so the shared two lines are the platform check, not omitted behaviour. These fragments are reported unnamed, so the keys must be path-only; they therefore also cover any future family contained entirely within these three files and are not a claim that every new clone in them is safe."
[[tool.duplication_gate.allow]]
members = ["cmd_mox/pytest_plugin.py", "cmd_mox/verifiers.py"]
reason = "The idiom if not <collection>: return \"<literal>\" appears in four diagnostic formatters that each render a different empty case: a teardown failure banner, an empty environment mapping, an empty invocation list, and an empty numbered list. The literal and the surrounding formatter differ every time, so the shared two lines are the shape of a guard, not a behaviour. A shared helper would need the caller to pass the replacement text, adding indirection for one if-statement."
[[tool.duplication_gate.allow]]
members = ["cmd_mox/verifiers.py", "cmd_mox/test_doubles.py"]
reason = "Two unrelated one-statement idioms in the same pair of files. verifiers.py has inverse length comparisons in OrderVerifier._check_missing_expectations and _check_extra_invocations (bail out when invocations already satisfy or already exceed the ordered sequence) plus the same if-not-then-return shape used by the empty-collection formatters above; test_doubles.py repeats self._validate_spy_usage(\"<method>\") at three assertion entry points that differ only in the method name they report. Both meanings come from the call site, so an extraction would be a shape-only helper. nose reports these fragments unnamed, so the keys are path-only; they also cover any future family contained entirely within these two files."

[[tool.duplication_gate.allow]]
members = ["cmd_mox/controller.py", "cmd_mox/passthrough.py"]
reason = "One call repeated in each file. cmd_mox/controller.py invokes self._require_replay_environment() from both the replay and verify preconditions because the two entry points need the same environment attributes; cmd_mox/passthrough.py invokes self._prune_expired_locked() under its own lock from both record and finalize_result because both must observe a pruned ledger. Neither pair shares a behaviour beyond the single guarded call, and the shared helper already exists in each case, so the duplication is the call itself. Both fragments are reported unnamed, so the keys are path-only and also cover any future family contained entirely within these two files."

[tool.skylos.gate]
strict = true

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["cmd_mox.ipc._server_core._BaseIPCServer._export_environment"]
reason = "_ServerLifecycle.start invokes this inherited hook before backend creation to export the active IPC environment."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["cmd_mox.ipc.server.IPCServer._prepare_backend_start"]
reason = "_ServerLifecycle.start invokes this Unix transport hook before creating _InnerServer."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["cmd_mox.ipc.server.IPCServer._wait_until_ready"]
reason = "_ServerLifecycle.start invokes this Unix transport hook after starting the backend thread to wait for the socket."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["cmd_mox.ipc.server.IPCServer._stop_backend"]
reason = "_ServerLifecycle.stop invokes this Unix transport hook to shut down _InnerServer."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["cmd_mox.ipc.server.IPCServer._post_stop_cleanup"]
reason = "_ServerLifecycle.stop invokes this Unix transport hook after joining the backend thread to remove the socket."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["cmd_mox.ipc._server_core.ParsedRequest.validate"]
reason = "_request_pipeline invokes this validator before dispatch for Unix and named-pipe request ingress."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["cmd_mox.ipc.named_pipe.NamedPipeServer._wait_until_ready"]
reason = "_ServerLifecycle.start invokes this named-pipe transport override after starting the backend thread to await readiness."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["cmd_mox.ipc.named_pipe.NamedPipeServer._stop_backend"]
reason = "_ServerLifecycle.stop invokes this named-pipe transport override to stop _NamedPipeState and join its clients."

[[tool.skylos.dead_code.entrypoints]]
type = "variable"
full_name = ["cmd_mox.ipc.windows.PyWinErrorProtocol"]
reason = "cmd_mox.ipc.windows.__all__ exports this pywintypes error protocol for external Windows transport test doubles and adapters."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["cmd_mox.ipc.named_pipe._NamedPipeState.stop"]
reason = "NamedPipeServer._wait_until_ready invokes this on timeout and NamedPipeServer._stop_backend invokes it during shutdown."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["cmd_mox.ipc.named_pipe._NamedPipeState._signal_stop_handle"]
reason = "_NamedPipeState.stop invokes this helper to signal the Win32 shutdown event before waking blocking operations."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["cmd_mox.ipc.named_pipe._NamedPipeState._poke_pipe"]
reason = "_NamedPipeState.stop invokes this helper as a fallback wake-up for the named-pipe accept loop."

[[tool.skylos.dead_code.entrypoints]]
type = "variable"
full_name = ["cmd_mox.environment._Win32Function.argtypes"]
reason = "_get_short_path assigns this ctypes argument signature to GetShortPathNameW through the typed protocol."

[[tool.skylos.dead_code.entrypoints]]
type = "variable"
full_name = ["cmd_mox.environment._Win32Function.restype"]
reason = "_get_short_path assigns this ctypes return type to GetShortPathNameW through the typed protocol."

[[tool.skylos.dead_code.entrypoints]]
type = "parameter"
full_name = ["cmd_mox.ipc._server_core._ServerLifecycle._stop_backend.server"]
reason = "_ServerLifecycle.stop invokes this lifecycle hook with the stored backend instance, which the Unix and named-pipe transports override to stop their backend."

[tool.skylos.whitelist]
names = ["bootstrap_shim_path"]

[tool.skylos.whitelist.documented]
bootstrap_shim_path = "cmd_mox.shim re-imports this helper after bootstrap before main invokes it."


[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["features"]
