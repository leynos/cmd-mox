name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Python distributions
        uses: ./.github/actions/pure-python-wheel
        with:
          python-version: '3.13'
          artifact-name: wheels-pure

  quality:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux QA
            run-windows-smoke: false
          - os: windows-latest
            label: Windows smoke
            run-windows-smoke: true
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      # Pin the Makefile validator so a new mbake release cannot fail the
      # build without a reviewed change here.
      MBAKE_VERSION: '1.4.6'
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
      # Keep in sync with NOSE_VERSION in the Makefile and [tool.nose].version
      # in pyproject.toml; tests/test_toolchain_contract.py enforces the match.
      NOSE_VERSION: '0.20.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Install CLI tools
        if: matrix.run-windows-smoke == false
        run: |
          uv tool install "mbake==${MBAKE_VERSION}"
          # Keep these pins in sync with RUFF_VERSION and TY_VERSION in the
          # Makefile; tests/test_toolchain_contract.py enforces the match.
          uv tool install 'ruff==0.16.4'
          uv tool install 'ty==0.0.74'

      # Restore the pinned detector. The key carries the version and the
      # runner's OS, so a pin bump or a different platform can never serve a
      # binary built for another target. `make install-nose` re-verifies the
      # reported version below. The uv cache itself is not cached here: every
      # uv call now goes through `uv_gate`, which uses the global cache that
      # the `setup-uv` step above already caches.
      - name: Restore the pinned detector
        if: matrix.run-windows-smoke == false
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/nose
          key: nose-${{ runner.os }}-${{ env.NOSE_VERSION }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            nose-${{ runner.os }}-${{ env.NOSE_VERSION }}-

      - name: Download cargo-binstall
        # A pinned release binary with a verified platform-specific checksum,
        # rather than the floating installer or a compile from source. The
        # install step below then forbids cargo-binstall's own compile and
        # quick-install strategies, so an unavailable prebuilt for a platform
        # is an explicit failure instead of a silent costly build.
        if: matrix.run-windows-smoke == false
        run: |
          curl -sSfL -o /tmp/cargo-binstall.tgz \
            "https://github.com/cargo-bins/cargo-binstall/releases/download/v1.25.2/cargo-binstall-x86_64-unknown-linux-gnu.tgz"
          echo "ca1217094690d15606c050e3d085bc03ce6fe12486de9a815d85dae345bb6803  /tmp/cargo-binstall.tgz" \
            | sha256sum --check --strict
          tar -xzf /tmp/cargo-binstall.tgz -C /tmp cargo-binstall
          install -m 0755 /tmp/cargo-binstall "$HOME/.local/bin/cargo-binstall"

      - name: Install the pinned detector
        if: matrix.run-windows-smoke == false
        run: make install-nose

      - name: Verify the detector version
        if: matrix.run-windows-smoke == false
        run: |
          reported="$(.tools/nose/nose --version)"
          test "${reported}" = "nose ${NOSE_VERSION}" || {
            echo "Expected 'nose ${NOSE_VERSION}', got '${reported}'" >&2
            exit 1
          }

      - name: Install Makefile parser
        if: matrix.run-windows-smoke == false
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Install make
        if: matrix.run-windows-smoke
        shell: pwsh
        run: choco install make --no-progress -y

      - name: Validate Makefile
        if: matrix.run-windows-smoke == false
        run: mbake validate Makefile

      - name: Install code
        if: matrix.run-windows-smoke == false
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        if: matrix.run-windows-smoke == false
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@6e99f225cb06684f9e6f89b63a7ca4a04095c067
        with:
          version: "0.6.1"

      - name: Check formatting
        if: matrix.run-windows-smoke == false
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        if: matrix.run-windows-smoke == false
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Run lint and dead-code detection
        if: matrix.run-windows-smoke == false
        run: make lint

      - name: Run the duplication-gate helper tests
        if: matrix.run-windows-smoke == false
        run: make duplication-test

      - name: Run typechecker
        if: matrix.run-windows-smoke == false
        run: make typecheck

      - name: Check the CV-005 contracts
        if: matrix.run-windows-smoke == false
        run: make test-workflow-contracts

      # Coverage runs on pull requests only, ratcheting against the
      # baseline coverage-main.yml writes on pushes to main; that workflow
      # is also the only one that uploads to CodeScene. Nothing here
      # publishes the report.
      - name: Generate coverage
        if: matrix.run-windows-smoke == false && github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@6e99f225cb06684f9e6f89b63a7ca4a04095c067
        with:
          output-path: coverage.xml
          format: cobertura
          # Track the installed package, not test harness or release tooling.
          python-source: cmd_mox
          # The suite currently runs serially (the previous slipcover step
          # used pytest-forked without xdist); keep it serial to stay
          # behaviour-preserving. Follow-up 4 removes this pin to adopt
          # pytest-xdist once the suite is confirmed xdist-clean.
          pytest-workers: ''
          with-ratchet: 'true'
          publish-artefact: 'false'

      - name: Run Windows smoke tests
        if: matrix.run-windows-smoke
        shell: pwsh
        run: make windows-smoke

      - name: Upload IPC logs
        if: matrix.run-windows-smoke && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.0.0
        with:
          name: windows-ipc-logs
          path: windows-ipc.log
          if-no-files-found: warn
