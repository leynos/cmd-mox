name: Coverage (main)

# The single CodeScene publisher. CodeScene accepts `cs-coverage upload`
# only for analysed branches, so main's coverage is uploaded here on
# push. Pull requests generate coverage with the ratchet this workflow
# advances, and nothing a pull request runs receives CodeScene
# credentials or contacts CodeScene. tests/test_codescene_coverage_contract.py
# holds the shape.

on:
  push:
    branches: [main]

# One publisher run per ref at a time, never cancelled. GitHub keeps one
# pending run per group, so a newer push replaces an older pending run
# and never interrupts a running one; the newest baseline wins. A
# cancelled run would abandon both its upload and its ratchet baseline
# write. The group is keyed on the ref so that a dispatch from another
# branch cannot displace a pending main run and then skip the upload.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          output-path: coverage.xml
          format: cobertura
          # Keep the run serial to match the pull-request coverage job;
          # see the note in ci.yml.
          pytest-workers: ''
          with-ratchet: 'true'

      - name: Upload coverage data to CodeScene
        # The token binds here and nowhere else in the workflow.
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        # The ref as well as the token. This workflow declares no
        # `workflow_dispatch` today, so the ref is always main; the guard
        # is here because a dispatch can aim at any branch, and the upload
        # carries no ref of its own.
        if: env.CS_ACCESS_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          # No checksum input: the action pins the CLI through its own
          # manifest, and `installer-checksum` is rejected from this pin.
