name: Release Python distributions

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the project version against the tag
        id: version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release_version.py

  build-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the sdist and pure-Python wheel
        uses: ./.github/actions/pure-python-wheel
        with:
          python-version: '3.13'
          artifact-name: wheels-pure

  attest:
    needs:
      - check-version
      - build-dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Required for GitHub's keyless provenance attestation.
      attestations: write # Required to publish the provenance attestation.
    steps:
      - name: Download the pure-Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wheels-pure
          path: dist
      - name: Collect the distributions for attestation
        id: collect
        run: |
          set -euo pipefail
          rm -rf -- dist/publish
          mkdir -p dist/publish
          mapfile -d '' files < <(
            find dist -path dist/publish -prune -o -type f \
              \( -name '*.whl' -o -name '*.tar.gz' \) -print0
          )
          sdists=()
          wheels=()
          for file in "${files[@]}"; do
            cp -- "${file}" dist/publish/
            case "${file}" in
              *.tar.gz) sdists+=("${file}") ;;
              *.whl) wheels+=("${file}") ;;
            esac
          done
          if [[ ${#sdists[@]} -ne 1 || ${#wheels[@]} -lt 1 ]]; then
            echo "::error::Expected exactly one sdist and at least one wheel." >&2
            exit 1
          fi
      - name: Attest distribution provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/publish/*
      - name: Stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          TAG_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p dist/attestations
          bundle_name="cmd-mox-${TAG_NAME}-run${RUN_ID}-${RUN_ATTEMPT}.sigstore.json"
          cp -- "${BUNDLE_PATH}" "dist/attestations/${bundle_name}"
      - name: Hand off the attested distributions and bundle
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dist
          path: |
            dist/publish
            dist/attestations
          if-no-files-found: error

  draft-release:
    needs:
      - check-version
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required to create and update the GitHub Release.
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.ref_name }}
      IS_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Download the attested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Create or reuse the draft release
        id: create
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Reusing the release for ${TAG_NAME}."
          else
            flags=(--draft --verify-tag --generate-notes --title "${TAG_NAME}")
            if [[ "${IS_PRERELEASE}" == true ]]; then
              flags+=(--prerelease)
            fi
            if ! gh release create "${TAG_NAME}" "${flags[@]}"; then
              gh release view "${TAG_NAME}" >/dev/null
            fi
          fi
      - name: Retain the current provenance bundle on the draft
        id: attach-bundle
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bundle_name="cmd-mox-${TAG_NAME}-run${RUN_ID}-${RUN_ATTEMPT}.sigstore.json"
          bundle_path="dist/attestations/${bundle_name}"
          if [[ ! -f "${bundle_path}" ]]; then
            echo "::error title=release-bundle::current run's provenance bundle is missing"
            exit 1
          fi
          mkdir -p github-state
          gh release view "${TAG_NAME}" --json isDraft,assets \
            > github-state/release-assets-before-bundle.json
          bundle_state="$(
            python3 - "${bundle_name}" \
              github-state/release-assets-before-bundle.json <<'PY'
          import json
          import sys
          from pathlib import Path

          name = sys.argv[1]
          document = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if not isinstance(document, dict):
              raise SystemExit("release inventory must be a JSON object")
          is_draft = document.get("isDraft")
          assets = document.get("assets")
          if not isinstance(is_draft, bool) or not isinstance(assets, list):
              raise SystemExit("release inventory is missing draft state or assets")
          if not all(isinstance(asset, dict) for asset in assets):
              raise SystemExit("release inventory contains an invalid asset")
          if not is_draft:
              print("published")
          elif any(asset.get("name") == name for asset in assets):
              print("present")
          else:
              print("missing")
          PY
          )"
          case "${bundle_state}" in
            missing)
              gh release upload "${TAG_NAME}" "${bundle_path}"
              ;;
            present)
              echo "The current run's bundle is already attached."
              ;;
            published)
              echo "The release is already published; early attachment is skipped."
              ;;
            *)
              echo "::error title=release-bundle::release returned an invalid bundle state"
              exit 1
              ;;
          esac
      - name: Snapshot existing release assets
        id: snapshot
        run: |
          set -euo pipefail
          mkdir -p github-state/files
          gh release view "${TAG_NAME}" --json assets > github-state/assets.json
          python3 -m scripts.release_assets_cli carryover \
            --publish dist/publish --assets github-state/assets.json \
            --bundles dist/attestations > github-state/carryover.txt
          while IFS= read -r name; do
            [[ -n "${name}" ]] || continue
            gh release download "${TAG_NAME}" --pattern "${name}" \
              --dir github-state/files
          done < github-state/carryover.txt
      - name: Hand off GitHub Release state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-github-state
          path: github-state
          if-no-files-found: error

  publish-pypi:
    needs:
      - attest
      - draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/cmd-mox/
    permissions:
      contents: read
      id-token: write # Required for PyPI Trusted Publishing via GitHub OIDC.
    env:
      GH_TOKEN: ${{ github.token }}
      PYPI_INDEX_URL: https://pypi.org/simple/cmd-mox/
      PYPI_INDEX_PATH: pypi-index.json
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Download the attested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Download GitHub Release state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-github-state
          path: github-state
      - name: Fetch the PyPI simple index
        id: index
        run: |
          set -euo pipefail
          bash scripts/fetch_pypi_index.sh
      - name: Remove artefacts already published to PyPI
        id: pending
        run: |
          set -euo pipefail
          python3 -m scripts.release_assets_cli attestation-checks \
            --purpose pypi --publish dist/publish --index "${PYPI_INDEX_PATH}" \
            --assets github-state/assets.json --bundles dist/attestations \
            --github-files github-state/files > attestation-candidates.tsv
          bash scripts/verify_attestations.sh \
            attestation-candidates.tsv verified-subjects.tsv
          python3 -m scripts.release_assets_cli stage-pypi \
            --publish dist/publish --index "${PYPI_INDEX_PATH}" \
            --assets github-state/assets.json --github-files github-state/files \
            --bundles dist/attestations \
            --verified-subjects verified-subjects.tsv
      - name: Publish distributions to PyPI
        id: upload
        if: steps.pending.outputs.remaining == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/publish/
          skip-existing: true

  publish-release:
    needs:
      - check-version
      - draft-release
      - publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Required to upload assets and publish the GitHub Release.
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.ref_name }}
      PYPI_INDEX_URL: https://pypi.org/simple/cmd-mox/
      PYPI_INDEX_PATH: pypi-index.json
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Download the attested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Download GitHub Release state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-github-state
          path: github-state
      - name: List the release assets
        id: assets
        run: |
          set -euo pipefail
          gh release view "${TAG_NAME}" --json assets > release-assets.json
      - name: Fetch the PyPI simple index
        id: index
        env:
          EXPECTED_PUBLISH_DIR: dist/publish
          RELEASE_ASSETS_PATH: release-assets.json
        run: |
          set -euo pipefail
          bash scripts/fetch_pypi_index.sh
      - name: Stage missing release assets
        id: stage
        run: |
          set -euo pipefail
          mkdir -p github-upload
          python3 -m scripts.release_assets_cli fetch-github \
            --publish dist/publish --index "${PYPI_INDEX_PATH}" \
            --assets release-assets.json > pypi-fetch.tsv
          while IFS=$'\t' read -r name url; do
            [[ -n "${name}" ]] || continue
            curl --silent --show-error --location --fail \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 300 \
              --output "github-upload/${name}" "${url}"
          done < pypi-fetch.tsv
          python3 -m scripts.release_assets_cli check-fetched \
            --publish dist/publish --index "${PYPI_INDEX_PATH}" \
            --assets release-assets.json --output github-upload
          python3 -m scripts.release_assets_cli attestation-checks \
            --purpose github --publish dist/publish --index "${PYPI_INDEX_PATH}" \
            --assets release-assets.json --bundles dist/attestations \
            --github-files github-state/files --output github-upload \
            > attestation-candidates.tsv
          bash scripts/verify_attestations.sh \
            attestation-candidates.tsv verified-subjects.tsv
          python3 -m scripts.release_assets_cli stage-github \
            --publish dist/publish --index "${PYPI_INDEX_PATH}" \
            --assets release-assets.json --bundles dist/attestations \
            --github-files github-state/files --output github-upload \
            --verified-subjects verified-subjects.tsv
      - name: Upload missing release assets
        id: upload
        if: steps.stage.outputs.pending == 'true'
        run: |
          set -euo pipefail
          gh release upload "${TAG_NAME}" github-upload/*
      - name: Verify PyPI and GitHub Release digests
        id: verify
        run: |
          set -euo pipefail
          gh release view "${TAG_NAME}" --json assets > release-assets.json
          python3 -m scripts.release_assets_cli verify \
            --publish dist/publish --index "${PYPI_INDEX_PATH}" \
            --assets release-assets.json --bundles dist/attestations \
            --github-files github-state/files --output github-upload \
            --verified-subjects verified-subjects.tsv
      - name: Publish the GitHub Release
        id: publish
        env:
          IS_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh release edit "${TAG_NAME}" --draft=false \
            --prerelease="${IS_PRERELEASE}"
