name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-mutmut-workflow.md.
on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-mutmut.yml@a0519a1476ab769ca7b8badfa794f3751213f1ea
    with:
      # Flat layout: mutable source lives under cmd_mox/, not src/.
      paths: "cmd_mox/"
      # No prefix to strip for a flat layout.
      module-prefix-strip: ""
      # A workflow_dispatch run mutates the whole package (about 6,000
      # mutants). The shared default of 90 minutes ends mid-run, so size the
      # step budget to the suite; the job ceiling remains 360 minutes.
      timeout-minutes: 240
