name: Build Pure Python Wheel and Sdist
description: >-
  Builds the source distribution and, from it, the pure Python wheel using uv,
  then uploads both as one artefact.
inputs:
  python-version:
    description: Python version to set up
    required: true
  out-dir:
    description: Directory to place the built sdist and wheel
    required: false
    default: dist
  artifact-name:
    description: Name of the uploaded artifact
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        enable-cache: false
    # Without --sdist or --wheel, uv builds the sdist first and then the wheel
    # from that sdist, so every run also proves the sdist is buildable.
    - name: Build sdist and wheel
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        uv build --out-dir "${OUT_DIR}"
        shopt -s nullglob
        sdists=("${OUT_DIR}"/*.tar.gz)
        wheels=("${OUT_DIR}"/*.whl)
        if [[ ${#sdists[@]} -ne 1 || ${#wheels[@]} -lt 1 ]]; then
          echo "::error::Expected exactly one sdist and at least one wheel in ${OUT_DIR}; found ${#sdists[@]} sdist(s) and ${#wheels[@]} wheel(s)." >&2
          exit 1
        fi
    - name: Upload sdist and wheel artefact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.out-dir }}/*.whl
          ${{ inputs.out-dir }}/*.tar.gz
        if-no-files-found: error
