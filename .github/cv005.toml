repository = "leynos/cmd-mox"

# The pull-request coverage step is skipped on the Windows smoke leg of the
# `quality` matrix, so its condition is the pull-request guard plus that
# matrix term. It measures what the publisher measures.
[[pairing]]
lane = "ci.yml:quality:Generate coverage"
publisher = "coverage-main.yml:coverage-upload:Generate coverage"
guards = ["matrix.run-windows-smoke == false"]

# What the publisher's ratcheting generator measures, exactly. The shared rules
# hold every lane equal to the publisher; this pins the publisher's own value,
# so a change made to both at once is still a reviewed change.
[selection]
output-path = "coverage.xml"
format = "cobertura"
pytest-workers = ""
with-ratchet = "true"
