# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = ["Flavored"] # Formal GitHub Flavored Markdown product name.

[words.corrections]

[patterns]
ignore = [
  # Literal external API spelling in the style guide.
  "`color`",
  # uv's colour-control environment variables, which carry the US spelling in
  # the name itself. The alternation is closed to the two names uv documents,
  # so a new `*_COLOR` variable is still reported rather than silently covered.
  "\\b(?:FORCE|NO)_COLOR\\b",
]

[files]
exclude = []
